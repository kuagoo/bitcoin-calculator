<!DOCTYPE html>
<!--
  Trading Risk & Position Calculator (Crypto Edition)
  버전: v4.2.0 — 코인 선물/마진 전용 (거래 수수료 반영 · 내장 이미지 제거)
-->
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="코인리스크계산기">
    <title>코인 선물 포지션 & 리스크 계산기</title>

    <!-- 홈화면 앱 아이콘 (사용자 custom 1.jpg 꾸아구 캐릭터) -->
    <link rel="apple-touch-icon" href="1.jpg">
    <link rel="icon" type="image/jpeg" href="1.jpg">

    <style>
        :root {
            --bg-color: #F5F2EB;
            --card-bg: #FFFFFF;
            --primary: #1E293B;
            --accent-green: #065F46;
            --accent-burgundy: #800020;
            --accent-navy: #1E3A8A;
            --text-main: #1F2937;
            --text-sub: #6B7280;
            --border: #E5E0D8;
            --input-bg: #FAFAFA;
            --warn-bg: #FEF3C7;
            --warn-border: #F59E0B;
            --danger-bg: #FDECEC;
            --danger-border: #B91C1C;
            --ok-bg: #ECFDF5;
        }

        * {
            box-sizing: border-box;
            -webkit-text-size-adjust: 100%;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 8px;
            padding-top: max(8px, env(safe-area-inset-top));
            padding-bottom: max(8px, env(safe-area-inset-bottom));
        }

        .calculator-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.05);
            margin: auto;
        }

        .title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title-icon-box {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .title-icon-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 10px;
            margin-bottom: 10px;
        }

        .full-width {
            grid-column: span 2;
        }

        .input-group {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 3px;
        }

        input:not([type=checkbox]) {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 9px;
            color: var(--text-main);
            font-size: 16px !important;
            font-weight: 600;
            outline: none;
            transition: all 0.15s;
            -webkit-appearance: none;
        }

        input:not([type=checkbox]):focus {
            background-color: #FFFFFF;
            border-color: var(--accent-navy);
            box-shadow: 0 0 0 2px rgba(30, 58, 138, 0.1);
        }

        input.input-danger {
            border-color: var(--danger-border);
            background-color: var(--danger-bg);
        }

        .result-box {
            background-color: #FAFAFA;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4.5px 0;
            border-bottom: 1px dashed var(--border);
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-sub);
        }

        .result-value {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .highlight-green {
            color: var(--accent-green);
            font-size: 0.98rem;
        }

        .highlight-navy {
            color: var(--accent-navy);
            font-size: 0.98rem;
        }

        .danger {
            color: var(--accent-burgundy);
        }

        .badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
        }

        .badge-long {
            background: var(--ok-bg);
            color: var(--accent-green);
        }

        .badge-short {
            background: var(--danger-bg);
            color: var(--accent-burgundy);
        }

        .alert-area {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .alert {
            font-size: 0.74rem;
            font-weight: 600;
            line-height: 1.3;
            border-radius: 8px;
            padding: 6px 10px;
            display: flex;
            gap: 6px;
            align-items: flex-start;
        }

        .alert-warn {
            background: var(--warn-bg);
            border: 1px solid var(--warn-border);
            color: #92400E;
        }

        .alert-danger {
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: #7F1D1D;
        }

        .alert-ok {
            background: var(--ok-bg);
            border: 1px solid #6EE7B7;
            color: var(--accent-green);
        }

        /* ===== 초기화 버튼 ===== */
        .reset-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .reset-actions button {
            flex: 1;
            border: 1px solid var(--border);
            background: var(--input-bg);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            transition: all .15s;
        }

        .reset-actions button:active {
            background: #E5E7EB;
            transform: scale(0.97);
        }
    </style>
</head>

<body>

    <div class="calculator-card" id="card">
        <div class="title">
            <div class="title-icon-box">
                <img src="1.jpg" alt="꾸아구">
            </div>
            코인 선물 포지션 & 리스크 계산기
        </div>

        <div class="grid-inputs">
            <!-- 1. 전체 시드 (기본값 100) -->
            <div class="input-group">
                <label for="totalCapital">전체 시드 (USDT)</label>
                <input type="text" id="totalCapital" value="100" placeholder="예: 100" inputmode="decimal"
                    pattern="[0-9.,]*" oninput="formatAndCalculate(this)">
            </div>

            <!-- 2. 1회 허용 리스크 (%) -->
            <div class="input-group">
                <label for="riskPercent">1회 허용 리스크 (%)</label>
                <input type="text" id="riskPercent" value="1" placeholder="1" inputmode="decimal" pattern="[0-9.,]*"
                    oninput="formatAndCalculate(this)">
            </div>

            <!-- 3. 거래 수수료 (편도 %, 테이커 기준 · 진입/청산 동일 적용) -->
            <div class="input-group">
                <label for="feePercent">거래 수수료 (편도 %)</label>
                <input type="text" id="feePercent" value="0.05" placeholder="예: 0.05" inputmode="decimal"
                    pattern="[0-9.,]*" oninput="formatAndCalculate(this)">
            </div>

            <!-- 4. 거래소 레버리지 배수 -->
            <div class="input-group">
                <label for="dynamicInput">거래소 레버리지 배수</label>
                <input type="text" id="dynamicInput" value="" placeholder="예: 5" inputmode="decimal" pattern="[0-9.,]*"
                    oninput="formatAndCalculate(this)">
            </div>

            <!-- 5. 최소 주문 수량 단위 (기본값 0.0001, 레버리지 다음 위치) -->
            <div class="input-group">
                <label for="minQtyStep">최소 주문 수량 단위 (Qty Step)</label>
                <input type="text" id="minQtyStep" value="0.0001" placeholder="예: 0.0001" inputmode="decimal"
                    pattern="[0-9.,]*" oninput="formatAndCalculate(this)">
            </div>

            <!-- 6. 진입 예정가 -->
            <div class="input-group">
                <label for="entryPrice">진입 예정가</label>
                <input type="text" id="entryPrice" value="" placeholder="진입 예정가" inputmode="decimal" pattern="[0-9.,]*"
                    oninput="formatAndCalculate(this)">
            </div>

            <!-- 7. 목표가 (TP, SL 앞으로 이동) -->
            <div class="input-group">
                <label for="takeProfitPrice">목표가 (Take Profit / TP)</label>
                <input type="text" id="takeProfitPrice" value="" placeholder="목표가(선택)" inputmode="decimal"
                    pattern="[0-9.,]*" oninput="formatAndCalculate(this)">
            </div>

            <!-- 8. 손절가 (SL) -->
            <div class="input-group">
                <label for="stopLossPrice">손절가 (Stop Loss / SL)</label>
                <input type="text" id="stopLossPrice" value="" placeholder="손절가" inputmode="decimal" pattern="[0-9.,]*"
                    oninput="formatAndCalculate(this)">
            </div>
        </div>

        <div class="result-box">
            <div class="result-row">
                <span class="result-label">포지션 방향</span>
                <span class="result-value" id="direction">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">계획 손익비 (Risk : Reward)</span>
                <span class="result-value highlight-green" id="rrRatio" style="font-size:1.05rem;">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">기대 수익금 (Take Profit PnL)</span>
                <span class="result-value highlight-green" id="expectedProfit" style="font-size:0.98rem;">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">기대 수익률 (ROI)</span>
                <span class="result-value highlight-navy" id="expectedRoi"
                    style="font-size:0.8rem;white-space:nowrap;">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">실제 허용 손실액 (1회)</span>
                <span class="result-value danger" id="maxLossAmount">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">손절폭 / 목표폭 (%)</span>
                <span class="result-value danger" id="slPercent">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">거래소 입력 포지션 크기</span>
                <span class="result-value highlight-green" id="positionValue">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">필요 증거금 (Margin)</span>
                <span class="result-value highlight-navy" id="valResultDynamic">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">실제 체결 수량</span>
                <span class="result-value" id="coinQty">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">예상 청산가 (근사치)</span>
                <span class="result-value danger" id="liqPrice">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">권장 최대 레버리지 (안전)</span>
                <span class="result-value highlight-navy" id="recMaxLev">—</span>
            </div>
        </div>

        <div class="alert-area" id="alertArea"></div>

        <div class="reset-actions">
            <button type="button" onclick="resetAll()">↺ 초기화</button>
        </div>
    </div>

    <script>
        const MAX_LEV_RULE = 5;

        document.querySelectorAll('.grid-inputs input').forEach(el => {
            el.addEventListener('blur', () => { window.scrollTo(0, 0); document.body.scrollTop = 0; });
        });

        function clearAllResults() {
            ['rrRatio', 'expectedProfit', 'expectedRoi', 'maxLossAmount', 'direction',
                'slPercent', 'positionValue', 'valResultDynamic', 'coinQty', 'liqPrice', 'recMaxLev']
                .forEach(id => { const e = document.getElementById(id); if (e) e.innerText = '—'; });
            document.getElementById('alertArea').innerHTML = '';
            document.getElementById('dynamicInput').classList.remove('input-danger');
            document.getElementById('stopLossPrice').classList.remove('input-danger');
        }

        function parseAndFormatInput(rawStr) {
            if (rawStr === null || rawStr === undefined) return { formatted: '', numValue: 0 };
            let str = rawStr.toString().trim();
            if (str === '') return { formatted: '', numValue: 0 };
            if (str.endsWith(',')) { str = str.slice(0, -1) + '.'; }
            else if (/^0,[0-9]*/.test(str)) { str = str.replace('0,', '0.'); }
            if (str.includes('.')) {
                const parts = str.split('.');
                const intStr = parts[0].replace(/[^0-9]/g, '');
                const decStr = parts.slice(1).join('').replace(/[^0-9]/g, '');
                let formattedInt = '';
                if (intStr !== '') {
                    const parsedInt = parseInt(intStr, 10);
                    formattedInt = !isNaN(parsedInt) ? parsedInt.toLocaleString() : '0';
                } else { formattedInt = '0'; }
                const formatted = formattedInt + '.' + decStr;
                const numValue = parseFloat((intStr || '0') + '.' + decStr) || 0;
                return { formatted, numValue };
            }
            const digitsOnly = str.replace(/[^0-9]/g, '');
            if (digitsOnly === '') return { formatted: '', numValue: 0 };
            const numValue = parseInt(digitsOnly, 10);
            return { formatted: numValue.toLocaleString(), numValue };
        }

        function parseNum(val) {
            if (!val) return 0;
            return parseAndFormatInput(val.toString()).numValue;
        }

        function formatNum(num, decimals = 0) {
            if (isNaN(num)) return '0';
            const parts = num.toFixed(decimals).split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return parts.join('.');
        }

        function formatPrice(num) {
            if (isNaN(num) || num <= 0) return '—';
            if (num < 1) return formatNum(num, 4);
            if (num < 100) return formatNum(num, 2);
            return num % 1 === 0 ? formatNum(num, 0) : formatNum(num, 2);
        }

        function formatAndCalculate(inputEl) {
            if (inputEl && inputEl.value !== undefined) {
                inputEl.value = parseAndFormatInput(inputEl.value).formatted;
            }
            calculate();
        }

        function renderAlerts(alerts) {
            const area = document.getElementById('alertArea');
            area.innerHTML = '';
            alerts.forEach(a => {
                const div = document.createElement('div');
                div.className = 'alert alert-' + a.type;
                div.innerHTML = '<span>' + a.icon + '</span><span>' + a.msg + '</span>';
                area.appendChild(div);
            });
        }

        function setDirection(isLong) {
            document.getElementById('direction').innerHTML = isLong
                ? '<span class="badge badge-long">▲ 롱 (Long)</span>'
                : '<span class="badge badge-short">▼ 숏 (Short)</span>';
        }

        // =================== 코인 포지션/리스크 계산 ===================
        function calculate() {
            const totalCapital = parseNum(document.getElementById('totalCapital').value);
            const riskPercent = parseNum(document.getElementById('riskPercent').value);
            const dynamicVal = parseNum(document.getElementById('dynamicInput').value);
            const dynamicInputEl = document.getElementById('dynamicInput');
            const minQtyStep = parseNum(document.getElementById('minQtyStep').value);
            const entryPrice = parseNum(document.getElementById('entryPrice').value);
            const takeProfitPrice = parseNum(document.getElementById('takeProfitPrice').value);
            const stopLossPrice = parseNum(document.getElementById('stopLossPrice').value);
            const feeRate = parseNum(document.getElementById('feePercent').value) / 100;   // 편도 수수료율

            if (entryPrice <= 0 || stopLossPrice <= 0 || totalCapital <= 0) {
                clearAllResults();
                return;
            }

            const isLong = stopLossPrice < entryPrice;
            setDirection(isLong);

            const maxLossAmount = totalCapital * (riskPercent / 100);
            const slPercent = Math.abs(entryPrice - stopLossPrice) / entryPrice * 100;
            if (slPercent === 0) { clearAllResults(); return; }

            // 손절 시 포지션 1 USDT당 총손실 = 가격 손실 + 진입 수수료 + 청산 수수료(손절가 기준)
            const slRate = slPercent / 100;
            const slFeeRate = feeRate * (1 + stopLossPrice / entryPrice);
            const lossRate = slRate + slFeeRate;
            const theoryPositionValue = maxLossAmount / lossRate;
            const theoryCoinQty = theoryPositionValue / entryPrice;
            let actualCoinQty = theoryCoinQty;
            let actualPositionValue = theoryPositionValue;
            if (minQtyStep > 0) {
                actualCoinQty = Math.floor(theoryCoinQty / minQtyStep) * minQtyStep;
                actualPositionValue = actualCoinQty * entryPrice;
            }
            const actualPriceLoss = actualPositionValue * slRate;
            const actualSlFee = actualPositionValue * slFeeRate;
            const actualMaxLoss = actualPriceLoss + actualSlFee;
            const actualRiskPercent = (actualMaxLoss / totalCapital) * 100;
            const qtyBelowMin = minQtyStep > 0 && actualCoinQty <= 0 && theoryCoinQty > 0;
            const minRiskForStep = totalCapital > 0 ? (minQtyStep * entryPrice) * lossRate / totalCapital * 100 : 0;
            const subStyle = 'font-size:0.7rem;color:var(--text-sub);font-weight:600;';
            const feeBreakdown = '가격 ' + formatNum(actualPriceLoss, 2) + ' + 수수료 ' + formatNum(actualSlFee, 2);

            if (qtyBelowMin) {
                document.getElementById('maxLossAmount').innerText = formatNum(Math.round(maxLossAmount));
                document.getElementById('positionValue').innerHTML = '<span class="danger">체결 불가 (최소 단위 미달)</span>';
                document.getElementById('coinQty').innerHTML = '<span class="danger">0</span> <span style="font-size:0.7rem;color:var(--text-sub);font-weight:600;">(이론 ' + theoryCoinQty.toFixed(5) + ' < 최소 ' + minQtyStep + ')</span>';
            } else if (minQtyStep > 0 && actualCoinQty > 0 && actualCoinQty < theoryCoinQty) {
                const decCount = minQtyStep < 0.0001 ? 5 : (minQtyStep < 0.001 ? 4 : (minQtyStep < 1 ? 3 : 0));
                const qtyDisplay = minQtyStep >= 1 ? actualCoinQty.toFixed(0) + ' 계약' : actualCoinQty.toFixed(decCount);
                document.getElementById('maxLossAmount').innerHTML = feeRate > 0
                    ? formatNum(actualMaxLoss, 2) + ' <span style="' + subStyle + '">(' + feeBreakdown + ' · 실제 ' + actualRiskPercent.toFixed(2) + '%)</span>'
                    : formatNum(actualMaxLoss, 2) + ' <span style="' + subStyle + '">(실제 ' + actualRiskPercent.toFixed(2) + '% · 이론 ' + formatNum(Math.round(maxLossAmount)) + ')</span>';
                document.getElementById('positionValue').innerHTML = formatNum(actualPositionValue, 2) + ' <span style="font-size:0.7rem;color:var(--text-sub);font-weight:600;">(이론 ' + formatNum(Math.round(theoryPositionValue)) + ')</span>';
                document.getElementById('coinQty').innerHTML = qtyDisplay + ' <span style="font-size:0.7rem;color:var(--text-sub);font-weight:600;">(이론 ' + theoryCoinQty.toFixed(4) + ')</span>';
            } else {
                if (feeRate > 0) {
                    document.getElementById('maxLossAmount').innerHTML = formatNum(actualMaxLoss, 2) + ' <span style="' + subStyle + '">(' + feeBreakdown + ')</span>';
                } else {
                    document.getElementById('maxLossAmount').innerText = formatNum(Math.round(maxLossAmount));
                }
                document.getElementById('positionValue').innerText = formatNum(Math.round(theoryPositionValue));
                document.getElementById('coinQty').innerText = formatNum(theoryCoinQty, 4);
            }

            const valResultDynamic = document.getElementById('valResultDynamic');
            let effLeverage = dynamicVal;
            let marginRequired = 0;
            if (effLeverage > 0) marginRequired = actualPositionValue / effLeverage;

            const isMarginOverSeed = marginRequired > totalCapital;
            if (isMarginOverSeed) {
                valResultDynamic.innerHTML = '<span class="danger">' + formatNum(Math.round(marginRequired)) + ' <span style="font-size:0.7rem;font-weight:700;">(시드 초과 🚨)</span></span>';
            } else {
                valResultDynamic.innerText = marginRequired > 0 ? formatNum(Math.round(marginRequired)) : '—';
            }

            const rrRatioEl = document.getElementById('rrRatio');
            const expectedProfitEl = document.getElementById('expectedProfit');
            const expectedRoiEl = document.getElementById('expectedRoi');
            const slPercentEl = document.getElementById('slPercent');
            let tpPercent = 0, rrRatio = 0, netRR = 0, expectedProfit = 0, isTpValid = false;

            if (takeProfitPrice > 0) {
                if (isLong && takeProfitPrice > entryPrice) {
                    tpPercent = (takeProfitPrice - entryPrice) / entryPrice * 100;
                    isTpValid = true;
                } else if (!isLong && takeProfitPrice < entryPrice) {
                    tpPercent = (entryPrice - takeProfitPrice) / entryPrice * 100;
                    isTpValid = true;
                }
                if (isTpValid) {
                    // 익절 시 포지션 1 USDT당 순수익 = 가격 이익 - 진입 수수료 - 청산 수수료(목표가 기준)
                    const tpRate = tpPercent / 100;
                    const tpFeeRate = feeRate * (1 + takeProfitPrice / entryPrice);
                    rrRatio = tpPercent / slPercent;                      // 수수료 전 손익비
                    netRR = (tpRate - tpFeeRate) / lossRate;              // 수수료 반영 손익비
                    const grossProfit = actualPositionValue * tpRate;
                    const tpFee = actualPositionValue * tpFeeRate;
                    expectedProfit = grossProfit - tpFee;
                    const accountRoi = (expectedProfit / totalCapital) * 100;
                    const marginRoi = marginRequired > 0 ? (expectedProfit / marginRequired) * 100 : 0;
                    if (feeRate > 0) {
                        rrRatioEl.innerHTML = '1 : <b>' + netRR.toFixed(2) + '</b> <span style="' + subStyle + '">(순 · 총 1:' + rrRatio.toFixed(2) + ')</span>';
                        expectedProfitEl.innerHTML = (expectedProfit >= 0 ? '+' : '−') + formatNum(Math.abs(expectedProfit), 2)
                            + ' <span style="' + subStyle + '">(총 +' + formatNum(grossProfit, 2) + ' · 수수료 -' + formatNum(tpFee, 2) + ')</span>';
                    } else {
                        rrRatioEl.innerHTML = '1 : <b>' + rrRatio.toFixed(2) + '</b>';
                        expectedProfitEl.innerText = '+' + formatNum(Math.round(expectedProfit));
                    }
                    expectedRoiEl.innerHTML = '<span class="highlight-green">' + (accountRoi >= 0 ? '+' : '') + accountRoi.toFixed(2) + '%</span>'
                        + '<span style="font-size:0.64rem;color:var(--text-sub);font-weight:600;"> 시드' + (feeRate > 0 ? '(순)' : '') + '</span> · '
                        + '<span>' + (marginRoi >= 0 ? '+' : '') + marginRoi.toFixed(1) + '%</span>'
                        + '<span style="font-size:0.64rem;color:var(--text-sub);font-weight:600;"> 증거금</span>';
                    slPercentEl.innerHTML = '<span class="danger">손절 -' + slPercent.toFixed(2) + '%</span> / <span class="highlight-green">익절 +' + tpPercent.toFixed(2) + '%</span>';
                } else {
                    rrRatioEl.innerText = '오류 (TP 방향 부적절)';
                    expectedProfitEl.innerText = '—';
                    expectedRoiEl.innerText = '—';
                    slPercentEl.innerText = '-' + slPercent.toFixed(2) + ' %';
                }
            } else {
                rrRatioEl.innerText = '—';
                expectedProfitEl.innerText = '—';
                expectedRoiEl.innerText = '—';
                slPercentEl.innerText = '-' + slPercent.toFixed(2) + ' %';
            }

            const liqPriceEl = document.getElementById('liqPrice');
            const recMaxLevEl = document.getElementById('recMaxLev');
            const maxLevByLiq = Math.floor(100 / slPercent);
            const recommendedMax = Math.max(1, Math.min(MAX_LEV_RULE, maxLevByLiq));
            recMaxLevEl.innerHTML = recommendedMax + '배 <span style="font-size:0.7rem;color:var(--text-sub);font-weight:600;">(권장 ≤' + MAX_LEV_RULE + ' · 청산안전 ≤' + maxLevByLiq + ')</span>';

            let liqDistPct = 0;
            if (effLeverage > 0) {
                liqDistPct = 100 / effLeverage;
                const liqPrice = isLong ? entryPrice * (1 - 1 / effLeverage) : entryPrice * (1 + 1 / effLeverage);
                liqPriceEl.innerText = formatPrice(liqPrice) + ' (진입 대비 ' + liqDistPct.toFixed(1) + '%)';
            } else {
                liqPriceEl.innerText = '—';
            }

            const alerts = [];
            if (isMarginOverSeed) {
                const reqLevForSeed = Math.ceil(actualPositionValue / totalCapital);
                alerts.push({
                    type: 'danger',
                    icon: '🚨',
                    msg: '<b>증거금 부족 (체결 불가)!</b> 필요 증거금(' + formatNum(Math.round(marginRequired)) + ')이 보유 시드(' + formatNum(totalCapital) + ')를 초과합니다. 레버리지를 <b>' + reqLevForSeed + '배 이상</b>으로 올리거나 포지션을 줄이세요.'
                });
            }
            if (qtyBelowMin) {
                alerts.push({
                    type: 'danger',
                    icon: '🚫',
                    msg: '<b>체결 불가 — 포지션이 최소 주문 단위(' + minQtyStep + ')보다 작습니다.</b> 리스크 ' + riskPercent + '%면 <b>' + theoryCoinQty.toFixed(5) + '</b>가 필요한데 최소는 ' + minQtyStep + '.<br>➡️ <b>해결:</b> ① 리스크를 <b>≈' + minRiskForStep.toFixed(2) + '%</b>로 · ② 손절폭이 더 좁은 셋업 · ③ 시드 증액.<br>⚠️ <b>레버리지를 올려도 안 풀립니다.</b>'
                });
            }
            if (riskPercent > 5) alerts.push({ type: 'danger', icon: '⚠️', msg: '1회 리스크 ' + riskPercent + '% — 과도합니다. 권장 1~3%(최대 5%).' });
            if (takeProfitPrice > 0 && !isTpValid) alerts.push({ type: 'danger', icon: '🚨', msg: '<b>목표가(TP) 방향 오류!</b> ' + (isLong ? '롱 TP는 진입가보다 높아야' : '숏 TP는 진입가보다 낮아야') + ' 합니다.' });
            if (isTpValid) {
                const rrTag = feeRate > 0 ? ' · 수수료 반영' : '';
                if (netRR <= 0) alerts.push({ type: 'danger', icon: '💸', msg: '<b>수수료를 빼면 목표가에서도 손실입니다.</b> 목표폭 ' + tpPercent.toFixed(2) + '%가 왕복 수수료보다 작습니다.' });
                else if (netRR < 1.5) alerts.push({ type: 'warn', icon: '⚠️', msg: '<b>손익비 열세 (R:R 1:' + netRR.toFixed(2) + rrTag + ')</b> — 1:1.5 미만. 진입 재고.' });
                else if (netRR >= 2.0) alerts.push({ type: 'ok', icon: '🎯', msg: '<b>우수한 손익비 (R:R 1:' + netRR.toFixed(2) + rrTag + ')</b> — 손실의 ' + netRR.toFixed(1) + '배!' });
            }
            const liqUnsafe = effLeverage > 0 && slPercent >= liqDistPct;
            if (liqUnsafe) alerts.push({ type: 'danger', icon: '🚨', msg: '<b>손절 도달 전 청산 위험!</b> 청산 ≈ 진입 대비 ' + liqDistPct.toFixed(1) + '%인데 손절폭 ' + slPercent.toFixed(1) + '%. 레버리지를 <b>' + maxLevByLiq + '배 이하</b>로.' });
            const overRule = effLeverage > MAX_LEV_RULE + 1e-9;
            if (overRule) alerts.push({ type: 'warn', icon: '⚠️', msg: '레버리지 ' + effLeverage.toFixed(effLeverage % 1 === 0 ? 0 : 1) + '배 — 권장(≤' + MAX_LEV_RULE + '배) 초과.' });
            if (alerts.length === 0 && effLeverage > 0) alerts.push({ type: 'ok', icon: '✅', msg: '레버리지 · 리스크 · 청산 여유 모두 안전 범위입니다.' });
            renderAlerts(alerts);
            dynamicInputEl.classList.toggle('input-danger', overRule || liqUnsafe || isMarginOverSeed);
        }

        // ===== 초기화 =====
        function resetAll() {
            document.getElementById('totalCapital').value = '100';
            document.getElementById('riskPercent').value = '1';
            document.getElementById('feePercent').value = '0.05';
            document.getElementById('dynamicInput').value = '';
            document.getElementById('minQtyStep').value = '0.0001';
            document.getElementById('entryPrice').value = '';
            document.getElementById('takeProfitPrice').value = '';
            document.getElementById('stopLossPrice').value = '';
            clearAllResults();
        }

        calculate();
    </script>

</body>

</html>
